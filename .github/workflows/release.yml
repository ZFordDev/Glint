name: GitHub Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build and publish
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0
      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          ruff format --check .
          ruff check .
          QT_QPA_PLATFORM=offscreen python -m pytest
      - name: Verify tag matches project version
        run: python scripts/release.py verify-tag "${{ inputs.tag || github.ref_name }}"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: glint-windows-x86_64
            archive: zip
          - os: macos-14
            asset: glint-macos-arm64
            archive: zip
          - os: macos-15-intel
            asset: glint-macos-x86_64
            archive: zip
          - os: ubuntu-22.04
            asset: glint-linux-x86_64
            archive: gztar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install release tooling
        run: python -m pip install -e ".[release]"
      - name: Build native bundle
        run: python scripts/release.py build --asset-name "${{ matrix.asset }}" --archive "${{ matrix.archive }}"
      - name: Upload native bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Download native bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: python scripts/release.py checksums release-assets
      - name: Publish GitHub Release
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --latest
