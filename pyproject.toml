[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glint-monitor"
version = "1.0.5"
description = "A Modern Painter-Rendered Desktop System Monitor"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ZFordDev", email = "zforddev@gmail.com" }
]

dependencies = [
    "psutil>=7.2.2",
    "PyQt6>=6.12.0",
    "wmi>=1.5.1; platform_system == 'Windows'",
    "pywin32>=312; platform_system == 'Windows'"
]

# Optional but recommended
license = { text = "MIT" }
keywords = ["system-monitor", "hud", "qt", "desktop", "windows", "linux", "macos"]

[project.scripts]
glint = "src.app:main"

[project.urls]
Repository = "https://github.com/ZFordDev/Glint"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["themes.json", "assets/*.svg"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.17.3", "tomli>=2.5.0; python_version < '3.11'"]
release = ["pyinstaller>=6.22.3", "tomli>=2.5.0; python_version < '3.11'"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
