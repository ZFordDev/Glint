[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glint-monitor"
version = "1.0.0"
description = "A Modern Painter-Rendered Desktop System Monitor"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ZFordDev", email = "zforddev@gmail.com" }
]

dependencies = [
    "psutil>=5.9",
    "PyQt6>=6.6",
    "wmi>=1.5.1; platform_system == 'Windows'",
    "pywin32>=306; platform_system == 'Windows'"
]

# Optional but recommended
license = { text = "MIT" }
keywords = ["system-monitor", "hud", "qt", "desktop", "windows", "linux", "macos"]

[project.scripts]
glint = "src.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["themes.json"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "tomli>=2; python_version < '3.11'"]
release = ["pyinstaller>=6.10", "tomli>=2; python_version < '3.11'"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
