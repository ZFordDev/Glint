    <path d="M128,122.879 L128,128 C157.755,139.478 188.086,137.744 217.6,122.879 C225.28,107.521 230.4,94.721 230.4,76.799 C201.58,108.192 165.193,124.567 128,122.879" fill="url(#grad-8)" />
